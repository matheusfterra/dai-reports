<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DermaClinic — Meta Ads Reports</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#0F172A;color:#fff;min-height:100vh;padding:2rem}
    header{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto 3rem;padding-bottom:1.5rem;border-bottom:1px solid #334155}
    .brand{display:flex;align-items:center;gap:.75rem}
    .logo-dai{font-weight:700;color:#6366F1;font-size:1.1rem}
    .sep{color:#334155;font-size:1.5rem}
    .logo-client{color:#94A3B8;font-size:1rem}
    .main{max-width:1100px;margin:0 auto}
    h1{font-family:'Playfair Display',serif;font-size:2.5rem;font-weight:400;margin-bottom:.5rem}
    .subtitle{color:#94A3B8;margin-bottom:3rem}
    .section-label{font-size:.75rem;font-weight:700;color:#6366F1;text-transform:uppercase;letter-spacing:.15em;margin-bottom:1rem}
    .reports-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;margin-bottom:3rem}
    .empty{color:#475569;font-style:italic;text-align:center;padding:3rem;background:#1E293B;border-radius:12px;border:1px dashed #334155}
    footer{color:#475569;font-size:.75rem;text-align:center;margin-top:4rem;padding-top:1.5rem;border-top:1px solid #1E293B}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo-dai">Digital AI</span>
      <span class="sep">x</span>
      <span class="logo-client">DermaClinic</span>
    </div>
    <span style="color:#475569;font-size:.8rem">reports.digital-ai.tech</span>
  </header>
  <main class="main">
    <h1>Meta Ads Intelligence</h1>
    <p class="subtitle">Relatórios de performance de campanhas — Joinville, SC</p>
    <div class="section-label">Relatórios Semanais</div>
    <div class="reports-grid">
      <div class="empty">Aguardando primeira coleta...</div>
    </div>
    <div class="section-label">Overviews Mensais</div>
    <div class="reports-grid">
      <div class="empty">Aguardando primeiro ciclo mensal...</div>
    </div>
  </main>
  <footer>Digital AI · Gerado automaticamente · reports.digital-ai.tech</footer>
</body>
</html>
