<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital AI — Reports</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="_shared/style.css" />
  <style>
    .restricted-wrapper {
      max-width: 480px;
      margin: 0 auto;
      padding: 120px 24px;
      text-align: center;
    }
    .restricted-icon {
      font-size: 48px;
      margin-bottom: 24px;
      opacity: 0.4;
    }
    .restricted-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .restricted-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="app visible">
    <div class="header">
      <div class="header-logo">
        <div class="header-logo-dot"></div>
        <span class="header-title">Digital AI</span>
      </div>
      <span class="header-sep">/</span>
      <span class="header-client" style="color:var(--text-subtle)">Reports</span>
    </div>

    <div class="restricted-wrapper">
      <div class="restricted-icon">🔒</div>
      <p class="restricted-title">Acesso restrito</p>
      <p class="restricted-desc">
        Os relatórios estão disponíveis apenas por link direto.<br>
        Se você recebeu um link de relatório, acesse-o diretamente.
      </p>
    </div>
  </div>
</body>
</html>
