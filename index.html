<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital AI — Reports Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#0F172A;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
    .card{background:#1E293B;border:1px solid #334155;border-radius:16px;padding:3rem;max-width:480px;width:100%;text-align:center}
    .logo{font-size:1.25rem;font-weight:700;color:#6366F1;margin-bottom:1.5rem;letter-spacing:0.05em}
    h1{font-size:1.75rem;font-weight:300;margin-bottom:.5rem}
    .sub{color:#94A3B8;font-size:.9rem;margin-bottom:2rem}
    .client-link{display:block;background:#0F172A;border:1px solid #334155;border-radius:10px;padding:1rem 1.5rem;margin-top:.75rem;text-decoration:none;color:#fff;transition:border-color .2s;text-align:left}
    .client-link:hover{border-color:#6366F1}
    .client-link .name{font-weight:600;font-size:.95rem}
    .client-link .desc{color:#94A3B8;font-size:.8rem;margin-top:.25rem}
    footer{color:#475569;font-size:.75rem;margin-top:2rem}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Digital AI</div>
    <h1>Reports Portal</h1>
    <p class="sub">Relatórios de performance para clientes Digital AI</p>
    <a href="/dermaclinic/meta-ads/" class="client-link">
      <div class="name">DermaClinic</div>
      <div class="desc">Meta Ads Intelligence — Joinville/SC</div>
    </a>
    <footer>reports.digital-ai.tech</footer>
  </div>
</body>
</html>
