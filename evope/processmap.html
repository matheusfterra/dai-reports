<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EVOPE — Mapa de Processos</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
:root{--bg:#080E2A;--bg2:#0D1535;--bg3:#111B40;--bg4:#172250;--bd:rgba(45,82,239,.22);--bd2:rgba(45,82,239,.12);--ac:#2D52EF;--ac2:#1E3EBD;--t:#E8EDF8;--t2:#9AAAD4;--t3:#5B6B99;--gr:#10B981;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;}
body{min-height:100vh;background:var(--bg);color:var(--t);font-family:'Inter','Segoe UI',system-ui,sans-serif;font-size:14px;overflow-x:hidden;}
.hdr{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 20px;height:54px;flex-shrink:0;}
.badge{background:var(--ac);border-radius:6px;padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:.5px;color:#fff;}
.hdr-title{font-size:14px;font-weight:600;}
.hdr-meta{font-size:11px;color:var(--t3);}
.back{margin-left:auto;font-size:11px;color:var(--t2);text-decoration:none;padding:5px 11px;border:1px solid var(--bd);border-radius:5px;white-space:nowrap;}
.back:hover{background:var(--bg3);color:var(--t);}
.kpi-strip{display:flex;flex-wrap:wrap;background:var(--bg2);border-bottom:1px solid var(--bd2);}
.kpi{flex:1;min-width:90px;display:flex;flex-direction:column;justify-content:center;padding:12px 16px;border-right:1px solid var(--bd2);}
.kpi:first-child{border-left:3px solid var(--ac);}
.kpi:last-child{border-right:none;}
.kv{font-size:22px;font-weight:700;line-height:1;}
.kl{font-size:10px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;}
.layout{display:flex;min-height:calc(100vh - 54px - 70px);}
.sidebar{width:256px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd2);overflow-y:auto;position:sticky;top:124px;align-self:flex-start;max-height:calc(100vh - 124px);}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px;}
.ss{border-bottom:1px solid var(--bd2);}
.sh{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.sh:hover{background:var(--bg3);}
.st{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);}
.sb{padding:10px 14px;}
.sb.hi{display:none;}
.fl{font-size:10px;color:var(--t3);font-weight:500;margin-bottom:3px;margin-top:6px;}
select,input[type=date]{background:var(--bg3);border:1px solid var(--bd);border-radius:5px;color:var(--t);font-size:12px;padding:7px 9px;width:100%;outline:none;}
select:focus,input[type=date]:focus{border-color:var(--ac);}
.btn-ap{background:var(--ac);color:#fff;border:none;border-radius:5px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;width:100%;margin-top:8px;}
.btn-ap:hover{background:var(--ac2);}
.btn-ap:disabled{opacity:.5;cursor:not-allowed;}
.leg-item{display:flex;align-items:center;gap:7px;padding:4px 6px;cursor:pointer;border-radius:4px;}
.leg-item:hover{background:var(--bg3);}
.leg-item.dim{opacity:.3;}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.leg-nm{font-size:11px;color:var(--t2);flex:1;}
.lc{font-size:10px;color:var(--t3);}
.ra-item{display:flex;align-items:center;gap:6px;padding:4px 0;cursor:pointer;border-radius:3px;}
.ra-item:hover{background:var(--bg3);}
.ra-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ra-nm{font-size:11px;color:var(--t2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ra-tm{font-size:10px;color:var(--t3);white-space:nowrap;}
.center{flex:1;display:flex;flex-direction:column;min-width:0;}
.graph-wrap{flex:1;position:relative;height:calc(100vh - 124px);min-height:500px;}
#graph{position:absolute;inset:0;width:100%;height:100%;}
#ld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:rgba(8,14,42,.88);}
#ld.hi{display:none;}
.ld-spin{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;}
.ld-txt{margin-top:12px;font-size:12px;color:var(--t3);}
@keyframes spin{to{transform:rotate(360deg);}}
.toolbar{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:20;}
.tbtn{background:rgba(13,21,53,.88);border:1px solid var(--bd);border-radius:6px;color:var(--t2);font-size:11px;padding:5px 10px;cursor:pointer;backdrop-filter:blur(4px);}
.tbtn:hover{background:var(--bg4);color:var(--t);}
.st-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(8,14,42,.82);border-top:1px solid var(--bd2);padding:5px 14px;font-size:10px;color:var(--t3);backdrop-filter:blur(4px);}
.drawer{width:0;overflow:hidden;background:var(--bg2);border-left:1px solid var(--bd2);position:sticky;top:124px;align-self:flex-start;max-height:calc(100vh - 124px);transition:width .22s cubic-bezier(.4,0,.2,1);flex-shrink:0;}
.drawer.open{width:290px;}
.drw-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd2);min-width:290px;}
.drw-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-right:8px;}
.drw-ttl{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.drw-close{background:none;border:none;color:var(--t3);font-size:16px;cursor:pointer;padding:0 4px;line-height:1;}
.drw-close:hover{color:var(--t);}
.drw-body{padding:12px 14px;overflow-y:auto;max-height:calc(100vh - 185px);min-width:290px;}
.drw-body::-webkit-scrollbar{width:3px;}
.drw-body::-webkit-scrollbar-thumb{background:var(--bd);}
.drw-sec{margin-bottom:14px;}
.drw-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-weight:600;}
.drw-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:12px;color:var(--t2);}
.drw-site{font-size:11px;color:var(--t2);padding:2px 0;display:flex;justify-content:space-between;}
.drw-cat{display:inline-block;background:var(--bg4);border:1px solid var(--bd);border-radius:10px;padding:2px 8px;font-size:10px;color:var(--t2);margin:2px 2px 2px 0;}
.conn-item{font-size:11px;color:var(--t2);padding:3px 0;cursor:pointer;display:flex;justify-content:space-between;}
.conn-item:hover{color:var(--t);}
</style>
</head>
<body>

<header class="hdr">
  <span class="badge">EVOPE</span>
  <span class="hdr-title">Mapa de Processos</span>
  <span class="hdr-meta" id="hdr-period">Carregando…</span>
  <a href="index.html" class="back">← Voltar</a>
</header>

<div class="kpi-strip">
  <div class="kpi"><div class="kv" id="k-apps">—</div><div class="kl">Aplicativos</div></div>
  <div class="kpi"><div class="kv" id="k-edges">—</div><div class="kl">Conexões</div></div>
  <div class="kpi"><div class="kv" id="k-emp">—</div><div class="kl">Colaboradores</div></div>
  <div class="kpi"><div class="kv" id="k-sess">—</div><div class="kl">Sessões</div></div>
  <div class="kpi"><div class="kv" id="k-grps">—</div><div class="kl">Grupos</div></div>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="ss">
      <div class="sh" onclick="tgl('sb-filter')"><span class="st">Filtros</span><span>▾</span></div>
      <div class="sb" id="sb-filter">
        <div class="fl">Data início</div><input type="date" id="d-ini"/>
        <div class="fl">Data fim</div><input type="date" id="d-end"/>
        <div class="fl">Grupo</div>
        <select id="grp-s"><option value="">Todos os grupos</option></select>
        <button class="btn-ap" id="btn-ap" onclick="applyFilters()">Atualizar Mapa</button>
      </div>
    </div>
    <div class="ss">
      <div class="sh" onclick="tgl('sb-leg')"><span class="st">Categorias</span><span>▾</span></div>
      <div class="sb" id="sb-leg"><div id="leg-list"></div></div>
    </div>
    <div class="ss">
      <div class="sh" onclick="tgl('sb-apps')"><span class="st">Top Aplicativos</span><span>▾</span></div>
      <div class="sb" id="sb-apps"><div id="top-apps"><span style="font-size:11px;color:var(--t3)">Carregando…</span></div></div>
    </div>
    <div class="ss">
      <div class="sh" onclick="tgl('sb-conns')"><span class="st">Top Conexões</span><span>▾</span></div>
      <div class="sb" id="sb-conns"><div id="top-edges"><span style="font-size:11px;color:var(--t3)">Carregando…</span></div></div>
    </div>
  </aside>

  <main class="center">
    <div class="graph-wrap">
      <div id="graph"></div>
      <div id="ld">
        <div class="ld-spin"></div>
        <div class="ld-txt" id="ld-txt">Buscando dados da EVOPE…</div>
      </div>
      <div class="toolbar">
        <button class="tbtn" onclick="fitGraph()">⊞ Fit</button>
        <button class="tbtn" id="phys-btn" onclick="togglePhysics()">⚡ Física</button>
        <button class="tbtn" onclick="closeDrawer()">✕ Painel</button>
      </div>
      <div class="st-bar" id="st-txt">Aguardando dados…</div>
    </div>
  </main>

  <div class="drawer" id="drawer">
    <div class="drw-hdr">
      <div class="drw-dot" id="drw-dot"></div>
      <div class="drw-ttl" id="k-sel">—</div>
      <button class="drw-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drw-body" id="drw-body"></div>
  </div>
</div>

<script>
const WEBHOOK='https://webhook.digital-ai.tech/webhook/evope/processmap';
const CATS={chrome:'Navegadores',msedge:'Navegadores',firefox:'Navegadores',opera:'Navegadores',brave:'Navegadores',discord:'Comunicação',teams:'Comunicação',slack:'Comunicação',zoom:'Comunicação',skype:'Comunicação',whatsapp:'Comunicação',telegram:'Comunicação',explorer:'Sistema',taskmgr:'Sistema',svchost:'Sistema',dwm:'Sistema',notepad:'Sistema',cmd:'Sistema',powershell:'Sistema',code:'Dev Tools','code - insiders':'Dev Tools',cursor:'Dev Tools',pycharm64:'Dev Tools',mongodbcompass:'Dev Tools',postman:'Dev Tools',docker:'Dev Tools',excel:'Office',winword:'Office',powerpnt:'Office',onenote:'Office',outlook:'Office',olk:'Office',onedrive:'Office',figma:'Design',photoshop:'Design',illustrator:'Design',xd:'Design',gimp:'Design',claude:'IA Tools',chatgpt:'IA Tools',copilot:'IA Tools',notion:'Produtividade',obsidian:'Produtividade',todoist:'Produtividade',spotify:'Entretenimento',vlc:'Entretenimento',steam:'Entretenimento',snippingtool:'Sistema',mspaint:'Sistema'};
const PCAT={'Navegadores':'#2D52EF','Comunicação':'#10B981','Sistema':'#6B7280','Dev Tools':'#F59E0B','Office':'#8B5CF6','Design':'#EC4899','IA Tools':'#06B6D4','Produtividade':'#84CC16','Entretenimento':'#F97316','Outro':'#374151'};
function gc(l){return CATS[(l||'').toLowerCase()]||'Outro';}
function fh(m){return m>=60?Math.round(m/60)+'h':Math.round(m)+'m';}

let net=null,nDS=null,eDS=null,physicsOn=true,appData=null,activeCats=new Set();

function buildNet(graph){
  const rawN=graph.nodes.map(n=>{const cat=gc(n.label),col=PCAT[cat]||PCAT['Outro'];return{id:n.id,label:n.label,value:n.value,title:makeTip(n),color:{background:col,border:col,highlight:{background:col,border:'#fff'},hover:{background:col,border:'#fff'}},font:{color:'#E8EDF8',size:13},_cat:cat,_col:col,_sites:n.topSites||[],_cats:n.siteCategories||[]};});
  const rawE=graph.edges.map(e=>({id:e.id,from:e.from,to:e.to,value:e.value,title:e.value+' co-ocorrências',color:{color:'rgba(45,82,239,.28)',highlight:'rgba(45,82,239,.9)',hover:'rgba(45,82,239,.6)'},font:{color:'#9AAAD4',size:10},scaling:{min:1,max:12}}));
  nDS=new vis.DataSet(rawN);eDS=new vis.DataSet(rawE);
  const el=document.getElementById('graph');
  if(net){net.destroy();net=null;}
  net=new vis.Network(el,{nodes:nDS,edges:eDS},{nodes:{shape:'dot',scaling:{min:16,max:64,label:{enabled:true,min:12,max:22}},borderWidth:2,shadow:{enabled:true,color:'rgba(0,0,0,.4)',size:8,x:2,y:2}},edges:{smooth:{type:'continuous',roundness:.3},scaling:{min:1,max:12},width:1.5,selectionWidth:3},physics:{enabled:true,forceAtlas2Based:{gravitationalConstant:-60,centralGravity:.005,springLength:230,springConstant:.18,damping:.4,avoidOverlap:.9},solver:'forceAtlas2Based',stabilization:{enabled:true,iterations:200,updateInterval:25}},interaction:{hover:true,tooltipDelay:120,navigationButtons:false,keyboard:true},layout:{randomSeed:42}});
  net.on('stabilizationIterationsDone',()=>document.getElementById('ld').classList.add('hi'));
  net.on('click',p=>{if(p.nodes.length>0){openDrawer(p.nodes[0]);hlNode(p.nodes[0]);}else{closeDrawer();clearHL();}});
}

function makeTip(n){
  const el=document.createElement('div');
  el.style='background:#0D1535;border:1px solid rgba(45,82,239,.3);border-radius:8px;padding:10px 13px;font-size:12px;color:#9AAAD4;line-height:1.7;max-width:250px;pointer-events:none';
  const sites=n.topSites||[],cats=n.siteCategories||[];
  let h='<strong style="color:#E8EDF8;font-size:13px;display:block;margin-bottom:5px">'+n.label+'</strong><div>'+fh(n.value)+' de uso total</div>';
  if(sites.length){h+='<div style="margin-top:5px;color:#E8EDF8;font-size:11px;font-weight:600">Top sites:</div>';sites.slice(0,5).forEach(([s,m])=>{h+='<div style="font-size:11px">· '+(s.length>34?s.slice(0,34)+'…':s)+' <span style="color:#5B6B99">('+fh(m)+')</span></div>';});}
  if(cats.length)h+='<div style="margin-top:5px;font-size:10px;color:#5B6B99">'+cats.join(' · ')+'</div>';
  el.innerHTML=h;return el;
}

function openDrawer(id){
  if(!nDS)return;const n=nDS.get(id);if(!n)return;
  document.getElementById('k-sel').textContent=n.label;
  document.getElementById('drw-dot').style.background=n._col;
  const connEdges=eDS.get({filter:e=>e.from===id||e.to===id}).sort((a,b)=>b.value-a.value).slice(0,10);
  const connHtml=connEdges.map(e=>{const oid=e.from===id?e.to:e.from;const o=nDS.get(oid);return o?'<div class="conn-item" onclick="focusNode('+oid+')"><span>'+o.label+'</span><span style="color:var(--t3)">'+e.value+'x</span></div>':'';}).join('');
  const sitesHtml=(n._sites||[]).slice(0,8).map(([s,m])=>'<div class="drw-site"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px">'+s+'</span><span style="color:var(--t3);white-space:nowrap">'+fh(m)+'</span></div>').join('');
  const catsHtml=(n._cats||[]).map(c=>'<span class="drw-cat">'+c+'</span>').join('');
  const nd=appData&&appData.graph.nodes.find(x=>x.id===id);
  document.getElementById('drw-body').innerHTML=
    '<div class="drw-sec"><div class="drw-lbl">Uso total</div>'
    +'<div class="drw-row"><span>Tempo</span><strong>'+fh(n.value)+'</strong></div>'
    +'<div class="drw-row"><span>Sessões</span><strong>'+(nd?nd.sessions:'—')+'</strong></div>'
    +'<div class="drw-row"><span>Categoria</span><strong>'+gc(n.label)+'</strong></div></div>'
    +(connEdges.length?'<div class="drw-sec"><div class="drw-lbl">Conectado com ('+connEdges.length+')</div>'+connHtml+'</div>':'')
    +(sitesHtml?'<div class="drw-sec"><div class="drw-lbl">Top Sites</div>'+sitesHtml+'</div>':'')
    +(catsHtml?'<div class="drw-sec"><div class="drw-lbl">Categorias</div>'+catsHtml+'</div>':'');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer(){document.getElementById('drawer').classList.remove('open');}
function hlNode(id){if(!nDS||!eDS)return;const eIds=eDS.get({filter:e=>e.from===id||e.to===id}).map(e=>e.id);net&&net.selectNodes([id]);net&&net.selectEdges(eIds);}
function clearHL(){net&&net.unselectAll();}
function focusNode(id){net&&net.focus(id,{scale:1.5,animation:{duration:600,easingFunction:'easeInOutQuad'}});openDrawer(id);hlNode(id);}
function fitGraph(){net&&net.fit({animation:{duration:600,easingFunction:'easeInOutQuad'}});}
function togglePhysics(){physicsOn=!physicsOn;net&&net.setOptions({physics:{enabled:physicsOn}});document.getElementById('phys-btn').textContent=physicsOn?'⚡ Física':'⚡ Pausar';}
function tgl(id){document.getElementById(id).classList.toggle('hi');}

function filterCat(cat,el){
  if(!nDS)return;
  el.classList.toggle('dim');
  if(activeCats.has(cat))activeCats.delete(cat);else activeCats.add(cat);
  nDS.update(nDS.get().map(n=>({id:n.id,hidden:activeCats.size>0&&!activeCats.has(n._cat)})));
}

function updateUI(data){
  const s=data.stats||{},g=data.graph||{nodes:[],edges:[]};
  document.getElementById('k-apps').textContent=s.totalNodes||'—';
  document.getElementById('k-edges').textContent=s.totalEdges||'—';
  document.getElementById('k-emp').textContent=s.totalEmployees||'—';
  document.getElementById('k-sess').textContent=s.totalSessions||'—';
  document.getElementById('k-grps').textContent=s.totalGroups||'—';
  const di=document.getElementById('d-ini').value.split('-').reverse().join('/');
  const de=document.getElementById('d-end').value.split('-').reverse().join('/');
  document.getElementById('hdr-period').textContent=di+' — '+de;
  const grpSel=document.getElementById('grp-s');
  const pv=grpSel.value;
  grpSel.innerHTML='<option value="">Todos os grupos</option>';
  (data.groups||[]).sort((a,b)=>a.name.localeCompare(b.name)).forEach(grp=>{const o=document.createElement('option');o.value=grp.id;o.textContent=grp.name;grpSel.appendChild(o);});
  grpSel.value=pv;
  const catCount={};g.nodes.forEach(n=>{const c=gc(n.label);catCount[c]=(catCount[c]||0)+1;});
  document.getElementById('leg-list').innerHTML=Object.keys(PCAT).filter(c=>catCount[c]>0).map(c=>`<div class="leg-item" data-cat="${c}" onclick="filterCat('${c}',this)"><div class="leg-dot" style="background:${PCAT[c]}"></div><span class="leg-nm">${c}</span><span class="lc">(${catCount[c]})</span></div>`).join('');
  const sn=[...g.nodes].sort((a,b)=>b.value-a.value);
  document.getElementById('top-apps').innerHTML=sn.slice(0,10).map(n=>{const cat=gc(n.label),col=PCAT[cat]||PCAT['Outro'];return`<div class="ra-item" onclick="focusNode(${n.id})"><div class="ra-dot" style="background:${col}"></div><span class="ra-nm">${n.label}</span><span class="ra-tm">${fh(n.value)}</span></div>`;}).join('');
  const se=[...g.edges].sort((a,b)=>b.value-a.value);
  document.getElementById('top-edges').innerHTML=se.slice(0,8).map(e=>{const fn=g.nodes.find(n=>n.id===e.from),tn=g.nodes.find(n=>n.id===e.to);return fn&&tn?`<div class="ra-item" onclick="focusNode(${e.from})"><span class="ra-nm">${fn.label} ↔ ${tn.label}</span><span class="ra-tm">${e.value}x</span></div>`:'';}).join('');
  document.getElementById('st-txt').textContent='Atualizado · '+di+' – '+de+' · '+(s.totalNodes||0)+' apps · '+(s.totalEdges||0)+' conexões · '+(s.totalGroups||0)+' grupos';
  activeCats=new Set();
}

async function loadData(body){
  const btn=document.getElementById('btn-ap');
  btn.disabled=true;btn.textContent='Carregando…';
  document.getElementById('ld').classList.remove('hi');
  document.getElementById('ld-txt').textContent='Buscando dados da EVOPE…';
  closeDrawer();clearHL();
  try{
    const r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const text=await r.text();
    if(!text||text.trim()==='')throw new Error('Resposta vazia do servidor');
    const data=JSON.parse(text);
    if(!data.graph||!data.graph.nodes)throw new Error('Dados inválidos');
    appData=data;
    updateUI(data);
    buildNet(data.graph);
  }catch(e){
    document.getElementById('ld').classList.add('hi');
    document.getElementById('st-txt').textContent='Erro: '+e.message;
    document.getElementById('top-apps').innerHTML='<span style="font-size:11px;color:#EF4444">'+e.message+'</span>';
  }
  btn.disabled=false;btn.textContent='Atualizar Mapa';
}

async function applyFilters(){
  const di=document.getElementById('d-ini').value;
  const de=document.getElementById('d-end').value;
  const grpId=document.getElementById('grp-s').value;
  await loadData(Object.assign({DateIni:di,DateEnd:de,SearchSubgroups:true},grpId?{ClientGroupId:Number(grpId)}:{}));
}

(function init(){
  const today=new Date();
  const end=today.toISOString().split('T')[0];
  const start=new Date(today.getTime()-7*24*60*60*1000).toISOString().split('T')[0];
  document.getElementById('d-ini').value=start;
  document.getElementById('d-end').value=end;
  loadData({DateIni:start,DateEnd:end,SearchSubgroups:true});
})();
</script>
</body>
</html>
